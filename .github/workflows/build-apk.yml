name: Build OpenFlow Whisper Android APK (Mobile Single-File Builder)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore embedded Android project
        shell: bash
        env:
          ANDROID_PROJECT_BASE64: |
            
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_PROJECT_BASE64" | base64 -d > /tmp/android-project.tar.gz
          tar -xzf /tmp/android-project.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Clone whisper.cpp
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git whisper.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager             "platform-tools"             "platforms;android-34"             "build-tools;34.0.0"             "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Whisper-Android-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
